                    content: `小智一直很怕水。每次上游泳課時，他總是緊緊抓著岸邊的欄杆，看著同學們在水裡像魚兒一樣游來游去，心裡既羨慕又害怕。因為他小時候曾經在海邊不小心嗆過水，從那之後，水對他來說就像是一個可怕的怪獸。<br><br>有一天，班上的游泳健將阿愷游到了小智身邊。「小智，你怎麼都不下來玩？」阿愷笑著問。<br>小智低下頭，小聲的說：「我怕水……我怕又會嗆到。」<br><br>阿愷聽了，沒有取笑他，反而站起身來，說：「別怕！這區的水很淺，只到我們的肚子而已。我教你一個好玩的方法，保證不會嗆到。」<br><br>阿愷牽著小智的手，讓他慢慢走下水。接著，阿愷示範了「水母漂」，他深吸一口氣，把頭埋進水裡，身體就像氣球一樣浮了起來。「你看，只要憋氣放鬆，水就會把你托起來哦！你試試看，我會在旁邊拉著你。」<br><br>看著阿愷鼓勵的眼神，小智深吸了一口氣，閉上眼睛，把臉稍微靠近水面。一次、兩次……雖然一開始還是會緊張得馬上抬起頭，但在阿愷耐心的陪伴下，小智終於成功把頭埋進水裡，而且感覺到身體真的輕飄飄的浮了起來！<br><br>「我做到了！阿愷，我浮起來了！」小智開心的在水裡又叫又跳。那天，小智雖然還不會換氣游泳，但他已經不再害怕那隻名叫「水」的怪獸了。`,

                { id: 4, category: "語文知識", concept: "詞彙意義", text: "下列哪一個選項，前後詞語意思相同？", options: ["愁眉苦臉／興高采烈", "五顏六色／色彩繽紛", "半途而廢／堅持到底", "狼吞虎嚥／細嚼慢嚥"], answer: 1, 
                  explanation: "我們要找兩個意思一樣的「相似詞」。<br>②「五顏六色」和「色彩繽紛」都是用來形容顏色很多、很漂亮的意思，所以它們意思相同。<br>至於其他選項，①、③、④ 都是意思完全相反的「相反詞」喔！" },
                { id: 5, category: "語文知識", concept: "成語理解", text: "下列選項的詞語解釋，哪一個正確？", options: ["井底之蛙：比喻見識廣博、聰明的人。", "守株待兔：形容做事情非常勤奮努力。", "畫蛇添足：比喻多此一舉，反而弄巧成拙。", "揠苗助長：指幫助植物快速生長的好方法。"], answer: 2, 
                  explanation: "✅ ③ 解釋正確！「畫蛇添足」就是在畫蛇時多畫了腳，比喻多做了一些不必要的事，反而把事情弄糟了。<br>❌ ① 井底之蛙：是指見識很「狹窄」的人（就像青蛙只看到井口大的天）。<br>❌ ② 守株待兔：是指妄想「不勞而獲」，不努力就想得到好處。<br>❌ ④ 揠苗助長：是指用「錯誤且心急」的方法想求快，結果反而害了植物枯死。" },
                { id: 6, category: "語文知識", concept: "詞語結構", text: "「輕輕的放下」是由副詞「輕輕的」加上動詞「放下」所組成的詞語。\n請問下列哪一個選項的詞語組成方式與「輕輕的放下」相同？", options: ["溫暖的陽光", "快樂的學校", "昨天的功課", "緊緊的抱住"], answer: 3, 
                  explanation: "題目的結構是：「形容動作的方式（副詞）」＋「一個動作（動詞）」。<br>④「緊緊的（形容動作）」＋「抱住（一個動作）」，完全符合這個結構！<br>其他選項（溫暖的陽光、快樂的學校、昨天的功課）都是「形容詞＋名詞」，沒有動作喔。" },
                { id: 7, category: "語文知識", concept: "句型辨識", text: "哥哥既會打籃球，又會彈鋼琴。\n上面的句子屬於「並列句」，下列哪一個選項也是「並列句」？", options: ["如果明天下雨，我們就不去爬山了。", "雖然他生病了，卻還是堅持來上學。", "妹妹一邊看電視，一邊吃著蘋果。", "因為昨天太晚睡覺，所以他今天遲到了。"], answer: 2, 
                  explanation: "「並列句」代表兩件事情是同時存在、沒有前後因果關係的。<br>③「妹妹一邊看電視，一邊吃著蘋果。」表示這兩個動作同時發生，屬於並列句。<br>（補充：①是假設句，②是轉折句，④是因果句。）" },
                { id: 8, category: "語文知識", concept: "刪除冗詞", text: "昨天晚上，這隻可愛的小狗非常十分聽話的守在門口。\n上面的句子應刪除哪一個詞語，才會變得最合理、通順？", options: ["可愛", "十分", "聽話", "門口"], answer: 1, 
                  explanation: "這句話裡的「非常」和「十分」都是代表「程度很高」的意思。把它們放在一起會顯得多餘、重複了（這叫做冗詞）。<br>只要刪除「十分」（或刪除非常），變成「非常聽話」或「十分聽話」，句子讀起來就會很通順囉！" },
                { id: 9, category: "語文知識", concept: "標點符號", text: "這本書真好看呀 你是在哪裡買的呢\n上面句子的空格裡，按照順序應該填入哪些標點符號？", options: ["， 。", "！ ？", "。 ！", "？ 。"], answer: 1, 
                  explanation: "「這本書真好看呀」這是一句充滿讚嘆和驚訝的話，所以結尾要用驚嘆號「！」。<br>「你是在哪裡買的呢」這是一句問別人的問題，所以結尾要用問號「？」。" },
                { id: 10, category: "語文知識", concept: "修辭技巧", text: "運用「擬人法」，可以讓文句更生動有趣。下列哪一個選項運用了「擬人法」？", options: ["操場上傳來陣陣歡樂的笑聲。", "他的眼睛像星星一樣閃閃發亮。", "春風溫柔的撫摸著我的臉頰。", "弟弟高興得像青蛙一樣跳了起來。"], answer: 2, 
                  explanation: "「擬人法」就是把大自然沒有生命的物品，當作「人」來寫，讓它會做人的動作。<br>③ 說春風會「溫柔的撫摸」，把風當作有手、有感情的人一樣，這就是標準的擬人法喔！<br>（選項②和④出現了「像...一樣」，屬於譬喻法。）" },
                { id: 11, category: "語文知識", concept: "寫作結構", text: "下列每個選項都是寫作大綱，哪一個是採用因果式(原因、經過、結果)的結構來安排文章內容？", options: ["走進動物園大門 → 參觀可愛動物區 → 來到猛獸區", "氣溫驟降忘記穿外套 → 不小心感冒發燒 → 乖乖在家休息康復", "媽媽長得很漂亮 → 媽媽很會煮菜 → 媽媽喜歡看書", "西瓜圓圓胖胖的 → 西瓜的果肉是紅色的 → 西瓜吃起來很甜"], answer: 1, 
                  explanation: "「因果式」代表前面發生的事情，導致了後面的結果。<br>② 忘記穿外套（原因）→ 導致感冒發燒（經過）→ 必須在家休息（結果），這完全符合因果邏輯關係！<br>（選項①是順序式，③和④只是把特徵並列列出來。）" },
                { id: 12, category: "語文知識", concept: "修辭技巧", text: "將身體或皮膚接觸事物所得到的感覺描寫出來，就是觸覺摹寫。\n下列哪一個選項運用了觸覺摹寫？", options: ["遠方的山頭覆蓋著一層白雪。", "柔軟的毛毯讓人覺得好溫暖。", "廚房傳來陣陣烤麵包的香氣。", "樹上的小鳥唱著輕快的歌曲。"], answer: 1, 
                  explanation: "請想像你閉上眼睛：<br>②「柔軟」和「溫暖」是必須用你的「皮膚」去觸摸才能感受到的，這就是觸覺摹寫。<br>（①是眼睛看的視覺；③是鼻子聞的嗅覺；④是耳朵聽的聽覺。）" },
                { id: 13, category: "語文知識", concept: "文體辨識", text: "失物招領：本人於今日上午在操場遺失一件藍色外套，若有同學撿到，請交至學務處，非常感謝！\n上面的文本，屬於下列哪一種文體？", options: ["說明文", "記敘文", "抒情文", "應用文"], answer: 3, 
                  explanation: "這是一則用來找東西的「啟事」。這類文章通常有特定的格式（像是寫清楚目的、聯絡方式），是為了解決日常生活問題而寫的實用文章，我們統稱為「應用文」。" },
                
                // Reading Comprehension Sample Questions
                { id: 18, category: "閱讀理解", concept: "大意摘要", text: "下課鐘聲一響，原本安靜的教室瞬間熱鬧起來。有人跑到操場打球，有人在走廊上聊天，也有人留在座位上畫畫，大家都把握這短暫的休息時間。\n上面的句子主要想告訴我們什麼事？", options: ["下課時所有人都去操場了。", "教室在下課時非常安靜。", "同學們下課時有各種不同的活動。", "大家都不喜歡下課時間。"], answer: 2, 
                  explanation: "這段文字列舉了打球、聊天、畫畫等好幾種不同的事情。把它們統整起來，就是在告訴我們「同學們下課時有各種不同的活動」。" },
                { id: 20, category: "閱讀理解", concept: "推論寓意", text: "「失敗為成功之母。」\n下列哪一個選項的敘述最能代表這句話的意思？", options: ["成功的人從來不會經歷失敗。", "母親總是會幫助我們獲得成功。", "只要失敗過一次，以後就一定會成功。", "從失敗中記取教訓，是邁向成功的基礎。"], answer: 3, 
                  explanation: "這是一句很有名的諺語！它的意思是：失敗就像是孕育成功的母親。只要我們能從失敗中找出原因、記取教訓，這些經驗就會成為我們未來獲得成功的穩固基礎。" },
                
                // Specific text questions (Text 1)
                { id: 22, category: "閱讀理解", concept: "提取訊息", text: "依據文章內容，小智一開始為什麼不敢下水游泳？", options: ["他覺得游泳池的水太冷了。", "他討厭班上的游泳健將阿愷。", "他小時候曾經在海邊嗆過水。", "他沒有帶適合的游泳圈。"], answer: 2, 
                  explanation: "請回到文章第一段尋找答案！文中明確寫著：「因為他小時候曾經在海邊不小心嗆過水，從那之後，水對他來說就像是一個可怕的怪獸。」" },
                { id: 23, category: "閱讀理解", concept: "文意推論", text: "依據文章內容，作者為什麼要將標題訂做「勇敢的一步」？", options: ["小智學會了在水底勇敢的走路。", "阿愷勇敢的保護了小智不被欺負。", "說明游泳是一項需要勇氣的危險運動。", "小智克服了心中的恐懼，願意下水嘗試。"], answer: 3, 
                  explanation: "小智原本把水當作可怕的怪獸。但他最後深吸一口氣，願意閉著眼睛把臉靠近水面。這對於怕水的人來說，是非常需要勇氣的突破，所以標題「勇敢的一步」象徵著他克服恐懼的心路歷程。" },
                { id: 24, category: "閱讀理解", concept: "統整主旨", text: "依據文章內容，本文要傳達的主旨是什麼？", options: ["朋友的鼓勵與陪伴能帶來克服困難的力量。", "每個人都應該從小學會各種游泳技巧。", "遇到害怕的事情，只要躲開就不會受傷。", "學習游泳一定要找最厲害的教練來教。"], answer: 0, 
                  explanation: "故事中最關鍵的轉折，是同學阿愷「沒有取笑他」，反而牽著他的手、在旁邊耐心鼓勵他。這份溫暖的友誼給了小智力量，這正是作者最想傳達給我們的道理。" },
                
                // Text 2
                { id: 25, category: "閱讀理解", concept: "提取訊息", text: "老雨傘一開始會出現在公園草地上的原因是什麼？", options: ["被李爺爺故意丟棄在公園。", "為了要跟小松鼠做朋友。", "被一陣大風吹走而掉落在那裡。", "主人特地帶來給小花貓睡覺的。"], answer: 2, 
                  explanation: "文章的第一句話就告訴我們原因了：「一陣大風吹過，把李爺爺手裡的舊雨傘吹走了... 最後掉在公園角落的草地上。」" },
                { id: 26, category: "閱讀理解", concept: "文意推論", text: "下列哪一個選項符合老雨傘的心境歷程轉變？", options: ["孤單 → 驚喜 → 快樂", "驚訝 → 生氣 → 難過", "害怕 → 孤單 → 快樂", "快樂 → 害怕 → 孤單"], answer: 0, 
                  explanation: "我們來追蹤老雨傘的心情：一開始掉在地上覺得沒用，很「孤單」；後來發現自己能當帳篷，覺得很「驚訝（喜）」；最後交到了好多新朋友，心裡充滿溫暖，覺得很「快樂」。" },
                { id: 27, category: "閱讀理解", concept: "統整主旨", text: "這個故事主要想告訴我們什麼想法？", options: ["隨便丟棄物品會造成環境嚴重的汙染。", "看似無用、老舊的東西也能發揮新的價值。", "下雨天出門一定要記得帶堅固的雨傘。", "小動物不應該隨便拿人類遺失的物品。"], answer: 1, 
                  explanation: "這是一篇充滿哲理的童話。一把壞掉、不能幫人擋雨的老雨傘，轉個念頭，卻能成為小動物的帳篷、大船和午休的地方。「天生我材必有用」，即使看似老舊無用的東西，換個位置也能找到發光發熱的新價值！" },
                
                // Text 3
                { id: 28, category: "閱讀理解", concept: "提取訊息", text: "依據文章內容，下列哪一個選項是正確的？", options: ["變色龍的舌頭很短，所以只能吃身邊的蟲子。", "變色龍的雙眼可以分別轉動，看向不同的方向。", "變色龍改變體色唯一的原因就是為了躲避敵人。", "變色龍的動作非常敏捷，常常在樹林間快速奔跑。"], answer: 1, 
                  explanation: "在小標題「會獨立轉動的眼睛」下方清楚寫著：「變色龍的雙眼非常特別，左眼和右眼可以分別看向不同的方向！」" },
                { id: 29, category: "閱讀理解", concept: "文意推論", text: "根據文章中提到的「變色龍改變體色」的原因，下列哪一項沒有被提及？", options: ["為了調節體溫（吸熱或散熱）。", "為了表達情緒或警告敵人。", "為了發出光芒吸引昆蟲靠近。", "為了隱藏自己與環境融為一體。"], answer: 2, 
                  explanation: "文章第三個小標題提到了變色是為了：隱藏自己(融為一體)、調節體溫(吸熱反光)、表達情緒警告敵人。但是從頭到尾都沒有提到「發光吸引昆蟲」，所以這是錯誤的敘述。" },
                { id: 30, category: "閱讀理解", concept: "統整主旨", text: "我們如果要幫這篇文章訂一個副標題，下列哪一個選項最合適？", options: ["變色龍的飲食習慣與消化", "變色龍的奇妙特徵與本領", "變色龍的居住環境與氣候", "變色龍的演化歷史與危機"], answer: 1, 
                  explanation: "文章的三個小標題（眼睛轉動、舌頭長度、變色能力）都是在介紹變色龍身上獨特的「身體特徵」與厲害的「生存本領」，因此選項②最能概括整篇文章的內容。" }
            ]
        };

        // --- STATE MANAGEMENT ---
        let currentTab = 'dashboard';
        let currentConceptFilter = 'all';
        let currentTextId = 'text-1';

        // --- DOM ELEMENTS & INIT ---
        document.addEventListener('DOMContentLoaded', () => {
            initCharts();
            initFilters();
            renderQuestions();
            initReadingTabs();
            renderReadingText();
            updateScoreBoard();
            initBackToTopButton();
        });

        // --- LOGIC: Back to Top Button ---
        function initBackToTopButton() {
            const btn = document.getElementById('backToTopBtn');
            window.addEventListener('scroll', () => {
                if (window.scrollY > 300) {
                    btn.classList.remove('opacity-0', 'pointer-events-none');
                    btn.classList.add('opacity-100');
                } else {
                    btn.classList.remove('opacity-100');
                    btn.classList.add('opacity-0', 'pointer-events-none');
                }
            });
        }

        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // --- UI LOGIC: Tabs ---
        function switchTab(tabId) {
            ['dashboard', 'explorer', 'reading'].forEach(id => {
                const btn = document.getElementById(`nav-${id}`);
                const sec = document.getElementById(`sec-${id}`);
                if (id === tabId) {
                    btn.className = "px-5 py-2 text-lg font-bold rounded-md bg-white shadow text-primary transition-colors";
                    sec.classList.remove('hidden');
                    sec.classList.add('block');
                } else {
                    btn.className = "px-5 py-2 text-lg font-bold rounded-md text-textMuted hover:text-textMain hover:bg-stone-200 transition-colors";
                    sec.classList.remove('block');
                    sec.classList.add('hidden');
                }
            });
            currentTab = tabId;
            scrollToTop(); // 切換分頁時，自動捲動回最上方
        }

        // --- LOGIC: Score Board ---
        function updateScoreBoard() {
            const answeredIds = Object.keys(testData.answeredState);
            const totalAnswered = answeredIds.length;
            const correctCount = answeredIds.filter(id => testData.answeredState[id]).length;
            
            const elCorrect = document.getElementById('score-correct');
            const elTotal = document.getElementById('score-total');
            const elBoard = document.getElementById('score-board');
            
            elCorrect.textContent = correctCount;
            elTotal.textContent = totalAnswered;
            
            // Add animation class
            elBoard.classList.remove('score-animate');
            void elBoard.offsetWidth; // trigger reflow
            elBoard.classList.add('score-animate');
        }

        // --- LOGIC: Dashboard Charts ---
        function initCharts() {
            Chart.defaults.font.family = "'Iansui', 'Microsoft JhengHei', sans-serif";
            Chart.defaults.font.size = 20; // 放大圖表字體
            
            const ctxDomain = document.getElementById('domainChart').getContext('2d');
            new Chart(ctxDomain, {
                type: 'doughnut',
                data: {
                    labels: ['語文知識題', '閱讀理解題'],
                    datasets: [{
                        data: [testData.overview.knowledge, testData.overview.reading],
                        backgroundColor: ['#0d9488', '#ea580c'],
                        borderWidth: 0,
                        hoverOffset: 4
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { position: 'bottom' } },
                    cutout: '65%'
                }
            });

            const ctxConcept = document.getElementById('conceptChart').getContext('2d');
            const conceptLabels = Object.keys(testData.concepts);
            const conceptData = Object.values(testData.concepts);
            new Chart(ctxConcept, {
                type: 'bar',
                data: {
                    labels: conceptLabels,
                    datasets: [{ label: '題數', data: conceptData, backgroundColor: '#0d9488', borderRadius: 6 }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    scales: {
                        y: { beginAtZero: true, ticks: { stepSize: 2 } },
                        x: {
                            ticks: {
                                callback: function(val, index) {
                                    let label = this.getLabelForValue(val);
                                    return label.length > 5 ? label.substring(0,5) + '..' : label;
                                }
                            }
                        }
                    },
                    plugins: { legend: { display: false } }
                }
            });
        }

        // --- LOGIC: Explorer ---
        function initFilters() {
            const container = document.getElementById('filter-container');
            const concepts = ["全部", "字音分辨", "多音字辨識", "形近字", "詞彙意義", "成語理解", "句型辨識", "修辭技巧", "文體辨識", "大意摘要", "提取訊息", "文意推論", "統整主旨"];
            
            concepts.forEach(concept => {
                const btn = document.createElement('button');
                btn.textContent = concept;
                btn.className = `px-4 py-2 text-lg rounded-full border transition-colors ${concept === '全部' ? 'bg-primary text-white border-primary shadow-sm' : 'bg-white text-textMuted border-stone-200 hover:border-primary hover:text-primary'}`;
                btn.onclick = () => filterQuestions(concept, btn);
                container.appendChild(btn);
            });
        }

        function filterQuestions(concept, clickedBtn) {
            currentConceptFilter = concept === '全部' ? 'all' : concept;
            const buttons = document.getElementById('filter-container').querySelectorAll('button');
            buttons.forEach(btn => {
                btn.className = `px-4 py-2 text-lg rounded-full border transition-colors ${btn === clickedBtn ? 'bg-primary text-white border-primary shadow-sm' : 'bg-white text-textMuted border-stone-200 hover:border-primary hover:text-primary'}`;
            });
            renderQuestions();
        }

        function renderQuestions() {
            const grid = document.getElementById('questions-grid');
            grid.innerHTML = '';
            const filtered = testData.questions.filter(q => currentConceptFilter === 'all' || q.concept === currentConceptFilter);

            if (filtered.length === 0) {
                grid.innerHTML = '<p class="text-textMuted col-span-full py-8 text-center text-xl">此分類暫無範例題目收錄。</p>';
                return;
            }

            filtered.forEach(q => {
                const card = document.createElement('div');
                card.className = 'bg-white p-6 rounded-xl shadow-sm border border-stone-200 interactive-card flex flex-col h-full';
                
                // 檢查這題是否已經作答過
                const answered = testData.answeredState.hasOwnProperty(q.id);
                
                let optionsHtml = q.options.map((opt, i) => {
                    // 若已作答，直接禁用按鈕並套用顏色
                    let btnClass = "w-full text-left flex items-start gap-4 p-4 rounded-xl border-2 transition-colors mb-3 ";
                    let spanClass = "font-bold shrink-0 w-10 h-10 flex items-center justify-center rounded-full text-xl transition-colors ";
                    
                    if (answered) {
                        if (i === q.answer) {
                            btnClass += "border-teal-500 bg-teal-50 text-teal-900";
                            spanClass += "bg-teal-500 text-white";
                        } else {
                            btnClass += "border-stone-200 bg-white opacity-40 cursor-default";
                            spanClass += "bg-stone-100";
                        }
                        return `
                            <button disabled class="${btnClass}">
                                <span class="${spanClass}">${i+1}</span>
                                <span class="mt-1 text-xl leading-relaxed">${opt}</span>
                            </button>
                        `;
                    } else {
                        // 尚未作答的狀態
                        btnClass += "border-stone-200 bg-white hover:bg-stone-50 cursor-pointer hover:border-stone-300";
                        spanClass += "bg-stone-100 text-stone-600";
                        return `
                            <button id="opt-exp-${q.id}-${i}" onclick="selectOption(${q.id}, ${i}, 'exp')" class="${btnClass}">
                                <span class="${spanClass}">${i+1}</span>
                                <span class="mt-1 text-xl leading-relaxed">${opt}</span>
                            </button>
                        `;
                    }
                }).join('');

                // 若已作答，顯示解析
                let ansHtml = '';
                if (answered) {
                    const isCorrect = testData.answeredState[q.id];
                    const headerHtml = isCorrect
                        ? `<div class="font-bold text-teal-700 mb-3 flex items-center gap-2"><span class="text-3xl">✅</span> <span class="text-2xl">答對了！你太棒了！</span></div>`
                        : `<div class="font-bold text-red-700 mb-3 flex items-center gap-2"><span class="text-3xl">❌</span> <span class="text-2xl">答錯了，正確答案是 ${q.answer + 1}</span></div>`;
                    ansHtml = `
                        <div class="mt-4 p-5 bg-stone-50 rounded-xl border-2 border-stone-200 block">
                            ${headerHtml}
                            <div class="text-stone-800 leading-relaxed text-xl mt-3 pt-3 border-t border-stone-200"><strong class="text-primary text-2xl mr-2">【詳解】</strong><br>${q.explanation}</div>
                        </div>`;
                } else {
                    ansHtml = `<div id="ans-exp-${q.id}" class="hidden mt-4 p-5 bg-stone-50 rounded-xl border-2 border-stone-200"></div>`;
                }

                card.innerHTML = `
                    <div class="flex justify-between items-start mb-5">
                        <span class="inline-block px-4 py-1.5 bg-primaryLight text-primary text-lg font-bold rounded-lg shadow-sm border border-teal-200">第 ${q.id} 題 • ${q.concept}</span>
                        <span class="text-stone-400 text-lg font-medium">${q.category}</span>
                    </div>
                    <p class="font-bold text-textMain mb-6 whitespace-pre-line text-2xl leading-relaxed tracking-wide">${q.text}</p>
                    <div class="mb-2 flex-grow">${optionsHtml}</div>
                    ${ansHtml}
                `;
                grid.appendChild(card);
            });
        }

        // --- LOGIC: Reading Texts ---
        function initReadingTabs() {
            const tabsContainer = document.getElementById('text-tabs');
            tabsContainer.innerHTML = '';
            testData.texts.forEach((text, index) => {
                const btn = document.createElement('button');
                btn.textContent = text.title;
                btn.className = `shrink-0 px-6 py-3 text-xl font-bold rounded-t-xl transition-colors ${index === 0 ? 'bg-white text-primary border-t-2 border-x-2 border-stone-200 shadow-[0_-2px_10px_-4px_rgba(0,0,0,0.1)]' : 'text-textMuted hover:text-textMain hover:bg-white/50 border-transparent border-b-2'}`;
                btn.onclick = () => selectReadingText(text.id, btn);
                tabsContainer.appendChild(btn);
            });
        }

        function selectReadingText(textId, clickedBtn) {
            currentTextId = textId;
            const tabs = document.getElementById('text-tabs').querySelectorAll('button');
            tabs.forEach(btn => {
                if (btn === clickedBtn) {
                    btn.className = 'shrink-0 px-6 py-3 text-xl font-bold rounded-t-xl transition-colors bg-white text-primary border-t-2 border-x-2 border-stone-200 shadow-[0_-2px_10px_-4px_rgba(0,0,0,0.1)]';
                } else {
                    btn.className = 'shrink-0 px-6 py-3 text-xl font-bold rounded-t-xl transition-colors text-textMuted hover:text-textMain hover:bg-white/50 border-transparent border-b-2';
                }
            });
            renderReadingText();
        }

        function renderReadingText() {
            const textData = testData.texts.find(t => t.id === currentTextId);
            if (!textData) return;

            const contentDiv = document.getElementById('text-content');
            contentDiv.innerHTML = `
                <span class="font-bold text-accent bg-orange-100 border border-orange-200 px-3 py-1 rounded-lg inline-block mb-4 text-lg">${textData.type}</span>
                <h3 class="text-4xl font-bold text-textMain mb-6 pb-4 border-b border-stone-100">${textData.title}</h3>
                <div class="text-stone-800 leading-loose text-2xl tracking-wide">${textData.content}</div>
            `;

            const qsDiv = document.getElementById('text-questions');
            qsDiv.innerHTML = '<h4 class="font-bold text-3xl mb-6 flex items-center gap-2 text-stone-700 px-2"><span>📝</span> 相關試題</h4>';
            
            const relatedQs = testData.questions.filter(q => textData.questions.includes(q.id));
            
            relatedQs.forEach(q => {
                const qCard = document.createElement('div');
                qCard.className = 'bg-white p-6 rounded-xl shadow-sm border border-stone-200 mb-6';
                
                const answered = testData.answeredState.hasOwnProperty(q.id);

                let optionsHtml = q.options.map((opt, i) => {
                    let btnClass = "w-full text-left flex items-start gap-4 p-4 rounded-xl border-2 transition-colors mb-3 ";
                    let spanClass = "font-bold shrink-0 w-10 h-10 flex items-center justify-center rounded-full text-xl transition-colors ";
                    
                    if (answered) {
                        if (i === q.answer) {
                            btnClass += "border-teal-500 bg-teal-50 text-teal-900";
                            spanClass += "bg-teal-500 text-white";
                        } else {
                            btnClass += "border-stone-200 bg-white opacity-40 cursor-default";
                            spanClass += "bg-stone-100";
                        }
                        return `<button disabled class="${btnClass}"><span class="${spanClass}">${i+1}</span><span class="mt-1 text-xl leading-relaxed">${opt}</span></button>`;
                    } else {
                        btnClass += "border-stone-200 bg-white hover:bg-stone-50 cursor-pointer hover:border-stone-300";
                        spanClass += "bg-stone-100 text-stone-600";
                        return `<button id="opt-read-${q.id}-${i}" onclick="selectOption(${q.id}, ${i}, 'read')" class="${btnClass}"><span class="${spanClass}">${i+1}</span><span class="mt-1 text-xl leading-relaxed">${opt}</span></button>`;
                    }
                }).join('');

                let ansHtml = '';
                if (answered) {
                    const isCorrect = testData.answeredState[q.id];
                    const headerHtml = isCorrect
                        ? `<div class="font-bold text-teal-700 mb-3 flex items-center gap-2"><span class="text-3xl">✅</span> <span class="text-2xl">答對了！</span></div>`
                        : `<div class="font-bold text-red-700 mb-3 flex items-center gap-2"><span class="text-3xl">❌</span> <span class="text-2xl">正確答案是 ${q.answer + 1}</span></div>`;
                    ansHtml = `<div class="mt-4 p-5 bg-stone-50 rounded-xl border-2 border-stone-200 block">${headerHtml}<div class="text-stone-800 leading-relaxed text-xl mt-3 pt-3 border-t border-stone-200"><strong class="text-primary text-2xl mr-2">【詳解】</strong><br>${q.explanation}</div></div>`;
                } else {
                    ansHtml = `<div id="ans-read-${q.id}" class="hidden mt-4 p-5 bg-stone-50 rounded-xl border-2 border-stone-200"></div>`;
                }

                qCard.innerHTML = `
                    <div class="flex justify-between items-center mb-4">
                        <span class="font-bold text-primary text-2xl">第 ${q.id} 題</span>
                        <span class="text-stone-500 bg-stone-100 px-3 py-1.5 rounded-lg font-bold text-lg">${q.concept}</span>
                    </div>
                    <p class="font-bold text-textMain mb-5 text-2xl leading-relaxed">${q.text}</p>
                    <div class="mb-2">${optionsHtml}</div>
                    ${ansHtml}
                `;
                qsDiv.appendChild(qCard);
            });
        }

        function selectOption(qId, selectedIdx, context) {
            const q = testData.questions.find(x => x.id === qId);
            if (!q) return;

            const isCorrect = (selectedIdx === q.answer);

            // Record answer and update global score
            if (!testData.answeredState.hasOwnProperty(qId)) {
                testData.answeredState[qId] = isCorrect;
                updateScoreBoard();
            }

            // Disable all options and update styling for the current view
            for (let i = 0; i < q.options.length; i++) {
                const btn = document.getElementById(`opt-${context}-${qId}-${i}`);
                if (!btn) continue;
                
                btn.disabled = true;
                btn.classList.remove('hover:bg-stone-50', 'cursor-pointer', 'hover:border-stone-300');
                btn.classList.add('cursor-default');

                const numSpan = btn.querySelector('span');

                if (i === q.answer) {
                    btn.classList.remove('border-stone-200', 'bg-white');
                    btn.classList.add('border-teal-500', 'bg-teal-50', 'text-teal-900');
                    numSpan.classList.remove('bg-stone-100', 'text-stone-600');
                    numSpan.classList.add('bg-teal-500', 'text-white');
                } else if (i === selectedIdx && !isCorrect) {
                    btn.classList.remove('border-stone-200', 'bg-white');
                    btn.classList.add('border-red-500', 'bg-red-50', 'text-red-900');
                    numSpan.classList.remove('bg-stone-100', 'text-stone-600');
                    numSpan.classList.add('bg-red-500', 'text-white');
                } else {
                    btn.classList.add('opacity-40');
                }
            }

            // Show explanation with animation
            const ansDiv = document.getElementById(`ans-${context}-${qId}`);
            if (ansDiv) {
                const headerHtml = isCorrect
                    ? `<div class="font-bold text-teal-700 mb-3 flex items-center gap-2"><span class="text-3xl">✅</span> <span class="text-2xl">答對了！你太棒了！</span></div>`
                    : `<div class="font-bold text-red-700 mb-3 flex items-center gap-2"><span class="text-3xl">❌</span> <span class="text-2xl">答錯了，正確答案是 ${q.answer + 1}</span></div>`;

                ansDiv.innerHTML = `
                    ${headerHtml}
                    <div class="text-stone-800 leading-relaxed text-xl mt-3 pt-3 border-t border-stone-200">
                        <strong class="text-primary text-2xl mr-2">【詳解】</strong><br>${q.explanation}
                    </div>
                `;
                ansDiv.classList.remove('hidden');
                ansDiv.classList.add('block', 'animate-fade-in');
            }
        }
    </script>
</body>
</html>
