            ],
            questions: [
                { id: 1, category: "語文知識", concept: "字音字形", text: "下列哪一個選項,前後「」中的國字讀音相同?", options: ["他在此「祈」求家人安康。/這場車禍造成她大腿骨「折」。", "姐姐的成「績」向來優異。/書桌上堆「積」了不少舊書報。", "請不要「移」動這些物品。/她從小就過著奢「侈」的生活。", "這種海「藻」在海邊常見。/城市裡常常有惱人的「噪」音。"], answer: 1, 
                  explanation: "我們把每個選項唸唸看：<br>① 「祈」求(ㄑㄧˊ) / 骨「折」(ㄓㄜˊ)<br>② 成「績」(ㄐㄧ) / 堆「積」(ㄐㄧ)，兩個字的音完全一樣喔！<br>③ 「移」動(ㄧˊ) / 奢「侈」(ㄔˇ)<br>④ 海「藻」(ㄗㄠˇ) / 「噪」音(ㄗㄠˋ)<br>所以正確答案是②。" },
                { id: 2, category: "語文知識", concept: "字音字形", text: "警方針對這起凶殺案,展開「調」查行動。\n上面句子的「調」字,與下列哪一個選項的「調」字讀音相同?", options: ["弟弟一向「調」皮搗蛋,只有爸爸媽媽在身旁時才會遵守規矩。", "最近公司的業績蒸蒸日上,因此老闆決定為所有員工「調」薪。", "原本不起眼的豆腐,經過媽媽的烹「調」後就變得美味可口了。", "這首歌的曲「調」婉轉動人,你只要聽過一次就會想聽第二次。"], answer: 3, 
                  explanation: "題目中「調」查的讀音是 <strong>ㄉㄧㄠˋ</strong>。<br>來看看選項裡的讀音：<br>① 「調」皮 (ㄊㄧㄠˊ)<br>② 「調」薪 (ㄊㄧㄠˊ)：指調整薪水。<br>③ 烹「調」 (ㄊㄧㄠˊ)：指料理調味。<br>④ 曲「調」 (ㄉㄧㄠˋ)：指音樂的聲調，跟調查一樣讀音！<br>因此正確答案是④。" },
                { id: 3, category: "語文知識", concept: "字音字形", text: "風一吹來,稻田裡掀起了陣陣「 ㄌㄩˋ」色波浪,讓我忍不住拿起手機把這一切記「ㄌㄨˋ」下來。\n句子中「」內依序應填入什麼字?", options: ["緣/錄", "綠/碌", "緣/碌", "綠/錄"], answer: 3, 
                  explanation: "這裡有兩組容易搞混的字型！<br>🔹 <strong>綠 vs 緣</strong>：稻田是綠色的，所以「ㄌㄩˋ」要填「綠」（糸部）；「緣」是緣分的緣，讀音是ㄩㄢˊ。<br>🔹 <strong>錄 vs 碌</strong>：把東西「記」下來，叫做紀「錄」（金部）；如果是忙「碌」的碌，則是石部。<br>因此正確組合是「綠／錄」，答案選④。" },
                { id: 4, category: "語文知識", concept: "詞彙語意", text: "下列哪一個選項,前後詞語意思相同?", options: ["萬無一失/十拿九穩", "栩栩如生/談笑風生", "靈機一動/有機可乘", "巧奪天工/熟能生巧"], answer: 0, 
                  explanation: "我們要找兩個意思相近的詞語。<br>①「萬無一失」和「十拿九穩」都是用來形容「非常有把握、絕對不會出錯」，所以意思相同，是正確答案。<br>② 栩栩如生(形容像活的一樣) / 談笑風生(形容聊天很愉快)。<br>③ 靈機一動(突然想到好點子) / 有機可乘(有漏洞或機會可以利用)。<br>④ 巧奪天工(形容手藝極高) / 熟能生巧(多練習就能找出好方法)。" },
                { id: 5, category: "語文知識", concept: "詞彙語意", text: "下列選項的詞語解釋,哪一個正確?", options: ["知己知彼:知道自己的人緣很好。", "奮不顧身:不顧生死的奮勇向前。", "心驚膽戰:內心驚訝卻努力作戰。", "花言巧語:既實在又動聽的言語。"], answer: 1, 
                  explanation: "✅ ② 解釋正確！「奮不顧身」就是奮勇向前，連自己的生命都不顧了。<br>❌ ① 知己知彼：是指了解自己，也了解對手的情況。<br>❌ ③ 心驚膽戰：形容非常害怕、恐懼，不是真的要去作戰。<br>❌ ④ 花言巧語：是指用虛假但好聽的話來騙人，一點都不「實在」。" },
                { id: 6, category: "語文知識", concept: "句型標點", text: "「慢慢的搓揉」是由副詞「慢慢的」加上動詞「搓揉」所組成的詞語。\n請問下列哪一個選項的詞語組成方式與「慢慢的搓揉」相同?", options: ["奇妙的滋味", "往日的時光", "仔細的品嘗", "美麗的世界"], answer: 2, 
                  explanation: "題目的結構是：「形容動作的方式（副詞）」＋「一個動作（動詞）」。<br>③「仔細的（形容動作）」＋「品嘗（一個動作）」，完全符合這個結構！<br>其他選項（奇妙的滋味、往日的時光、美麗的世界）都是「形容詞＋名詞（東西）」，沒有包含動作喔。" },
                { id: 7, category: "語文知識", concept: "句型標點", text: "妹妹一邊騎腳踏車,一邊哼歌。\n上面的句子屬於「並列句」,下列哪一個選項也是「並列句」?", options: ["我每次吃東西前,一定會先洗手。", "他因為沒寫作業,而被禁止下課。", "哥哥喜歡吃水果,也喜歡吃蔬菜。", "你放學後是回家,還是去安親班?"], answer: 2, 
                  explanation: "「並列句」代表兩件事情平等、同時發生，沒有誰先誰後，也沒有因果關係。<br>③「哥哥喜歡吃水果，也喜歡吃蔬菜。」這兩樣喜歡的事情是並列存在的，屬於並列句。<br>（補充：①是承接句/條件句，②是因果句，④是選擇句。）" },
                { id: 8, category: "語文知識", concept: "詞彙語意", text: "到餐廳用餐時,弟弟不但沒有認真專心吃飯,還一直目不轉睛的看著窗外來往的車輛。\n上面的句子應刪除哪一個詞語,才會變得最合理、通順?", options: ["認真", "用餐", "一直", "來往"], answer: 0, 
                  explanation: "這句話裡的「認真」和「專心」意思幾乎一樣，把它們疊放在一起會顯得語意重複（這叫做冗言贅字）。<br>只要刪除「認真」，留下「專心吃飯」，句子讀起來就會非常通順囉！" },
                { id: 9, category: "語文知識", concept: "句型標點", text: "你快點說吧（    ） 這枝掃把是不是你弄斷的（       ） \n上面句子的空格裡,按照順序應該填入哪些標點符號?", options: ["， 。", "！ 。", "， ？", "！ ？"], answer: 3, 
                  explanation: "「你快點說吧」帶有催促、要求對方回答的語氣，情緒較強烈，不只是單純停頓，因此應使用驚嘆號「！」，表達語氣的急切與強調。<br>「這枝掃把是不是你弄斷的」這是一句問別人的問題，所以結尾要用問號「？」。<br>因此正確組合是「！ ？」答案選④。" },
                { id: 10, category: "語文知識", concept: "修辭寫作", text: "運用「擬人法」,可以讓文句更生動有趣。下列哪一個選項運用了「擬人法」?", options: ["街邊的路燈,用它的光亮擁抱著我。", "他美妙的歌聲,傳遍了每一個角落。", "天上的太陽,是我永遠玩不到的皮球。", "麻雀在樹梢上輕輕跳動,揮舞翅膀。"], answer: 0, 
                  explanation: "「擬人法」就是把大自然沒有生命的物品，當作「人」來寫，讓它會做人的動作或帶有人的感情。<br>① 說路燈會用光亮「擁抱」我，把路燈當作有手、溫暖的人一樣，這就是標準的擬人法！<br>（選項③是譬喻法，把太陽比喻成皮球。）" },
                { id: 11, category: "語文知識", concept: "修辭寫作", text: "下列每個選項都是寫作大綱,哪一個是採用因果式(原因、經過、結果)的結構來安排文章內容?", options: ["春天來了萬物恢復生機 → 夏天時鳳凰花開蟬聲鳴 → 秋高氣爽金黃落葉紛飛", "學校的前庭有繽紛花草 → 教學大樓有琅琅讀書聲 → 後方的操場是遊戲天堂", "人類製造許多塑膠製品 → 廢棄塑膠大量流入海裡 → 使得海洋生物受到威脅", "我的興趣很廣泛 → 我喜歡靜態的閱讀、畫畫 → 我也喜歡各種動態活動"], answer: 2, 
                  explanation: "「因果式」代表前面發生的事情，導致了後面的結果。<br>③ 人類製造塑膠（原因）→ 廢棄流入海裡（經過）→ 使得海洋生物受威脅（結果），這完全符合因果邏輯關係！<br>（①是時間順序，②是空間順序，④是總分並列。）" },
                { id: 12, category: "語文知識", concept: "修辭寫作", text: "將身體或皮膚接觸事物所得到的感覺描寫出來,就是觸覺摹寫。\n下列哪一個選項運用了觸覺摹寫?", options: ["冰冷的雨水一次次打痛我的臉頰。", "淡紅荷花零星分布在綠色荷葉間。", "窗外正嘩啦嘩啦的下著傾盆大雨。", "一陣淡淡的米飯香從廚房裡飄來。"], answer: 0, 
                  explanation: "請想像你閉上眼睛：<br>①「冰冷」和「打痛」是必須用你的「皮膚」去接觸雨水才能感受到的，這就是觸覺摹寫。<br>（②是眼睛看的視覺；③是耳朵聽的聽覺；④是鼻子聞的嗅覺。）" },
                { id: 13, category: "語文知識", concept: "修辭寫作", text: "媽媽:\n今天放學後,我要留在學校練習合唱比賽的曲目,大約晚上六點會回到家。\n兒子東東敬上\n12月20日\n上面的文本,屬於下列哪一種文體?", options: ["抒情文", "說明文", "應用文", "記敘文"], answer: 2, 
                  explanation: "這是一張用來交代行蹤的「便條」。這類文章有特定的格式（稱謂、署名、日期），且是為了解決日常生活問題而寫的實用文書，我們統稱為「應用文」。" },
                
                // Q14~Q21 歸入閱讀理解/語文知識延伸
                { id: 14, category: "語文知識延伸", concept: "詞彙語意", text: "下列哪一個選項,前後「」內的字意思相同?", options: ["忍痛割「捨」/接受施「捨」", "開路先「鋒」/部隊前「鋒」", "心「酸」故事/「酸」甜苦辣", "記「載」事實/「載」貨回家"], answer: 1, 
                  explanation: "②開路先「鋒」和部隊前「鋒」的「鋒」，都是指「在前面帶頭的人事物」，意思完全相同。<br>（①捨棄/給予；③悲痛/酸味；④記錄/裝運。意思都不一樣喔。）" },
                { id: 15, category: "語文知識延伸", concept: "詞彙語意", text: "我把硬幣投進許願池裡,希望心願可以真的實現。\n上面句子中的「投」,與下列哪一個選項中的「投」意思最接近?", options: ["自「投」羅網", "失敗「投」降", "「投」稿校刊", "「投」球姿勢"], answer: 3, 
                  explanation: "題目中「投」進許願池，是「丟入、扔擲」的動作。<br>④「投」球姿勢的投，也是丟擲的意思，所以最接近。<br>（①進入；②屈服；③寄發文章。）" },
                { id: 16, category: "語文知識延伸", concept: "詞彙語意", text: "下列哪一個選項,前後詞語的關係和其他選項不同?", options: ["勤奮/懶惰", "快樂/哀傷", "大方/自私", "辛勞/辛苦"], answer: 3, 
                  explanation: "我們來看看每組詞語的關係：<br>①勤奮相反是懶惰、②快樂相反是哀傷、③大方相反是自私。前三個都是「相反詞」。<br>只有④「辛勞」和「辛苦」意思是相近的，是「相似詞」，所以它和別人不一樣。" },
                { id: 17, category: "語文知識延伸", concept: "詞彙語意", text: "下列選項中的「壓力」,哪一個的意思與另外三個不同?", options: ["最近的工作「壓力」讓他焦慮不安,因而影響到睡眠品質。", "潛水員在水底受到強大「壓力」,因此移動時會更加困難。", "雖然大學畢業後就有就業「壓力」,但表哥還是樂觀面對。", "適當的學習「壓力」能促使人們進步,進而挑戰自我極限。"], answer: 1, 
                  explanation: "②水底的「壓力」是指物理上的「水壓」，是真實存在的力量。<br>而①工作、③就業、④學習的「壓力」，都是指人們心裡的負擔、緊張的感受（心理壓力）。所以②的意思不同。" },
                { id: 18, category: "語文知識延伸", concept: "大意主旨", text: "騎樓下躲雨的人不少,但是大家看到雨不停的下,有的人穿上雨衣,有的人拿出雨傘,一個一個走了,很快就只剩下我一個人。\n上面的句子主要想告訴我們什麼事?", options: ["在騎樓下躲雨的人很少。", "這場雨只有下了一陣子。", "這段期間騎樓下都有人。", "帶雨具的人紛紛的走了。"], answer: 3, 
                  explanation: "整句話的重點在描述：原本很多人躲雨，但因為雨不停，那些有準備雨衣和雨傘（帶雨具）的人就一個接一個離開了，最後才只剩作者。" },
                { id: 19, category: "語文知識延伸", concept: "大意主旨", text: "我一直懷疑姊姊有特異功能,很可能是外星人送來地球的密探;外星人把她寄放在媽媽的肚子裡,讓她誕生在我家成了我姊姊。媽媽說姊姊從小就不愛哭,乖乖的吃飽睡、睡飽吃,可見她有多奇特;而每次當媽媽拿我跟姊姊比較後,也讓我更加懷疑我們是不是親生姊妹。\n下列哪一個選項最能代表本段文字的大意?", options: ["媽媽比較喜歡姊姊。", "作者覺得姊姊很奇特。", "作者的姊姊是個外星人。", "作者的姊姊是外星人的密探。"], answer: 1, 
                  explanation: "這段文章用誇張、有趣的方式（懷疑是外星人密探），來表達作者覺得姊姊不哭不鬧的個性真的太「奇特」了！姊姊並不是真的外星人，所以選②最適合概括全文。" },
                { id: 20, category: "語文知識延伸", concept: "大意主旨", text: "天分高的人如果太懶惰,而不努力發揮他的才能,也難有什麼大成就,反而不如那些天分低卻努力的人。\n下列哪一個選項的敘述最能代表這句話的意思?", options: ["只要天分足夠,早晚都會成功。", "沒有失敗經驗的人,不會成功。", "擁有天賦的人也需要勤奮努力。", "所有事情都需要付出才有收穫。"], answer: 2, 
                  explanation: "這句話在比較「天分」跟「努力」。它強調就算天分再高，如果不努力還是沒用。所以這句話是要告訴我們：「擁有天賦的人也需要勤奮努力」，選③最精確。" },
                { id: 21, category: "語文知識延伸", concept: "大意主旨", text: "早年,臺灣是個農業社會。那是個沒有電視,收音機又不普遍的時代,書報雜誌也不多;教育更不普遍,一般人知識水準也都不高。那個時代,要傳播一個消息,無法透過傳播媒體,只能靠人工沿街喊叫宣告,因此「打鑼的」成為地方上的報馬仔。鏘鏘鏘,街上只要聽到鑼聲響起,就是打鑼的有事要宣布了。\n下列哪一個選項最能代表本段文字的涵義?", options: ["臺灣早期的傳播科技落後世界各國。", "農業社會導致一般人知識水準不高。", "打鑼的人在當時負責傳遞重要消息。", "電視的發明可以讓訊息傳遞更便利。"], answer: 2, 
                  explanation: "這段文字前半部在鋪陳早年沒有媒體的背景，後半部則帶出文章的主角：「因此『打鑼的』成為地方上的報馬仔...負責宣布事情」。所以整段文字主要在介紹打鑼的人在當時扮演傳遞消息的重要角色。" },
                
                // Specific text questions (Text 1)
                { id: 22, category: "閱讀理解", concept: "訊息推論", text: "依據《我懂你》文章內容,婷如剛轉學來的時候,為什麼會感到不安?", options: ["說話太小聲大家都沒聽到。", "對新學校的環境感到陌生。", "不喜歡別人一直盯著她看。", "小玲還沒有主動跟她說話。"], answer: 1, 
                  explanation: "請回到文章第二段尋找答案！文中明確寫著：「婷如剛來新學校,對一切都感到很陌生,也不太知道該說什麼、做什麼...」" },
                { id: 23, category: "閱讀理解", concept: "訊息推論", text: "依據《我懂你》文章內容,作者為什麼要將標題訂做「我懂你」?", options: ["回想起與婷如相似的處境。", "在觀察中知道婷如的背景。", "感謝詩涵伸出友誼的雙手。", "自己也喜歡坐在角落沉思。"], answer: 0, 
                  explanation: "文章第四段提到，作者看見婷如孤單的樣子，就「不禁想起自己剛上學時的情景」，因為自己也曾經因為不熟悉環境而害怕，這份「我也曾經歷過、我懂妳的感受」正是標題的由來。" },

        // --- STATE MANAGEMENT ---
        let currentTab = 'dashboard';
        let currentConceptFilter = 'all';
        let currentTextId = 'text-1';

        // --- DOM ELEMENTS & INIT ---
        document.addEventListener('DOMContentLoaded', () => {
            initCharts();
            initFilters();
            renderQuestions();
            initReadingTabs();
            renderReadingText();
            updateScoreBoard();
            initBackToTopButton();
        });

        // --- LOGIC: Back to Top Button ---
        function initBackToTopButton() {
            const btn = document.getElementById('backToTopBtn');
            window.addEventListener('scroll', () => {
                if (window.scrollY > 300) {
                    btn.classList.remove('opacity-0', 'pointer-events-none');
                    btn.classList.add('opacity-100');
                } else {
                    btn.classList.remove('opacity-100');
                    btn.classList.add('opacity-0', 'pointer-events-none');
                }
            });
        }

        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // --- UI LOGIC: Tabs ---
        function switchTab(tabId) {
            ['dashboard', 'explorer', 'reading'].forEach(id => {
                const btn = document.getElementById(`nav-${id}`);
                const sec = document.getElementById(`sec-${id}`);
                if (id === tabId) {
                    btn.className = "px-6 py-2 text-xl font-bold rounded-lg bg-white shadow-md text-primary transition-colors";
                    sec.classList.remove('hidden');
                    sec.classList.add('block');
                } else {
                    btn.className = "px-6 py-2 text-xl font-bold rounded-lg text-textMuted hover:text-textMain hover:bg-stone-200 transition-colors";
                    sec.classList.remove('block');
                    sec.classList.add('hidden');
                }
            });
            currentTab = tabId;
            scrollToTop();
        }

        // --- LOGIC: Score Board ---
        function updateScoreBoard() {
            const answeredIds = Object.keys(testData.answeredState);
            const totalAnswered = answeredIds.length;
            const correctCount = answeredIds.filter(id => testData.answeredState[id]).length;
            
            // 計算正確率 (避免除以 0)
            let percent = 0;
            if (totalAnswered > 0) {
                percent = Math.round((correctCount / totalAnswered) * 100);
            }
            
            document.getElementById('score-correct').textContent = correctCount;
            document.getElementById('score-total').textContent = totalAnswered;
            document.getElementById('score-percent').textContent = percent + "%";
            
            const elBoard = document.getElementById('score-board');
            elBoard.classList.remove('score-animate');
            void elBoard.offsetWidth; // trigger reflow
            elBoard.classList.add('score-animate');
        }

        // --- LOGIC: Dashboard Charts ---
        function initCharts() {
            Chart.defaults.font.family = "'Iansui', 'Microsoft JhengHei', sans-serif";
            Chart.defaults.font.size = 20; 
            
            const ctxDomain = document.getElementById('domainChart').getContext('2d');
            new Chart(ctxDomain, {
                type: 'doughnut',
                data: {
                    labels: ['語文知識題', '閱讀理解題'],
                    datasets: [{
                        data: [testData.overview.knowledge, testData.overview.reading],
                        backgroundColor: ['#0d9488', '#ea580c'],
                        borderWidth: 0,
                        hoverOffset: 4
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { position: 'bottom' } },
                    cutout: '65%'
                }
            });

            const ctxConcept = document.getElementById('conceptChart').getContext('2d');
            const conceptLabels = Object.keys(testData.concepts);
            const conceptData = Object.values(testData.concepts);
            new Chart(ctxConcept, {
                type: 'bar',
                data: {
                    labels: conceptLabels,
                    datasets: [{ label: '題數', data: conceptData, backgroundColor: '#0d9488', borderRadius: 8 }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    scales: {
                        y: { beginAtZero: true, ticks: { stepSize: 2 } },
                        x: {
                            ticks: {
                                callback: function(val, index) {
                                    let label = this.getLabelForValue(val);
                                    return label.length > 5 ? label.substring(0,5) + '..' : label;
                                }
                            }
                        }
                    },
                    plugins: { legend: { display: false } }
                }
            });
        }

        // --- LOGIC: Explorer ---
        function initFilters() {
            const container = document.getElementById('filter-container');
            const concepts = ["全部", "字音字形", "詞彙語意", "句型標點", "修辭寫作", "大意主旨", "訊息推論"];
            
            concepts.forEach(concept => {
                const btn = document.createElement('button');
                btn.textContent = concept;
                btn.className = `px-5 py-2 text-xl rounded-full border-2 transition-colors ${concept === '全部' ? 'bg-primary text-white border-primary shadow-sm font-bold' : 'bg-white text-textMuted border-stone-200 hover:border-primary hover:text-primary font-bold'}`;
                btn.onclick = () => filterQuestions(concept, btn);
                container.appendChild(btn);
            });
        }

        function filterQuestions(concept, clickedBtn) {
            currentConceptFilter = concept === '全部' ? 'all' : concept;
            const buttons = document.getElementById('filter-container').querySelectorAll('button');
            buttons.forEach(btn => {
                btn.className = `px-5 py-2 text-xl rounded-full border-2 transition-colors ${btn === clickedBtn ? 'bg-primary text-white border-primary shadow-sm font-bold' : 'bg-white text-textMuted border-stone-200 hover:border-primary hover:text-primary font-bold'}`;
            });
            renderQuestions();
        }

        function renderQuestions() {
            const grid = document.getElementById('questions-grid');
            grid.innerHTML = '';
            
            // Explorer 區塊顯示 Q1~Q21
            const filtered = testData.questions.filter(q => q.id <= 21 && (currentConceptFilter === 'all' || q.concept === currentConceptFilter));

            if (filtered.length === 0) {
                grid.innerHTML = '<p class="text-textMuted col-span-full py-12 text-center text-2xl font-bold bg-white rounded-xl border border-stone-100">此分類暫無題目。</p>';
                return;
            }

            filtered.forEach(q => {
                const card = document.createElement('div');
                card.className = 'bg-white p-8 rounded-2xl shadow-sm border border-stone-200 interactive-card flex flex-col h-full';
                const answered = testData.answeredState.hasOwnProperty(q.id);
                
                let optionsHtml = q.options.map((opt, i) => {
                    let btnClass = "w-full text-left flex items-start gap-4 p-5 rounded-2xl border-2 transition-colors mb-4 ";
                    let spanClass = "font-black shrink-0 w-12 h-12 flex items-center justify-center rounded-full text-2xl transition-colors ";
                    
                    if (answered) {
                        if (i === q.answer) {
                            btnClass += "border-teal-500 bg-teal-50 text-teal-900 shadow-sm";
                            spanClass += "bg-teal-500 text-white";
                        } else {
                            btnClass += "border-stone-200 bg-white opacity-40 cursor-default";
                            spanClass += "bg-stone-100";
                        }
                        return `<button disabled class="${btnClass}"><span class="${spanClass}">${i+1}</span><span class="mt-1.5 text-2xl leading-relaxed">${opt}</span></button>`;
                    } else {
                        btnClass += "border-stone-200 bg-white hover:bg-stone-50 cursor-pointer hover:border-stone-300";
                        spanClass += "bg-stone-100 text-stone-600";
                        return `<button id="opt-exp-${q.id}-${i}" onclick="selectOption(${q.id}, ${i}, 'exp')" class="${btnClass}"><span class="${spanClass}">${i+1}</span><span class="mt-1.5 text-2xl leading-relaxed">${opt}</span></button>`;
                    }
                }).join('');

                let ansHtml = '';
                if (answered) {
                    const isCorrect = testData.answeredState[q.id];
                    const headerHtml = isCorrect
                        ? `<div class="font-bold text-teal-700 mb-4 flex items-center gap-3"><span class="text-4xl">✅</span> <span class="text-3xl">答對了！太棒了！</span></div>`
                        : `<div class="font-bold text-red-700 mb-4 flex items-center gap-3"><span class="text-4xl">❌</span> <span class="text-3xl">答錯了，正確答案是 ${q.answer + 1}</span></div>`;
                    ansHtml = `
                        <div class="mt-6 p-6 bg-stone-50 rounded-2xl border-2 border-stone-200 block shadow-inner">
                            ${headerHtml}
                            <div class="text-stone-800 leading-relaxed text-2xl mt-4 pt-4 border-t-2 border-stone-200"><strong class="text-primary text-3xl mr-2">【詳解】</strong><br>${q.explanation}</div>
                        </div>`;
                } else {
                    ansHtml = `<div id="ans-exp-${q.id}" class="hidden mt-6 p-6 bg-stone-50 rounded-2xl border-2 border-stone-200 shadow-inner"></div>`;
                }

                card.innerHTML = `
                    <div class="flex justify-between items-center mb-6 border-b border-stone-100 pb-4">
                        <span class="inline-block px-5 py-2 bg-primaryLight text-primary text-2xl font-black rounded-lg shadow-sm border border-teal-200">第 ${q.id} 題</span>
                        <span class="text-stone-500 bg-stone-100 px-4 py-1.5 rounded-lg text-xl font-bold">${q.concept}</span>
                    </div>
                    <p class="font-bold text-textMain mb-8 whitespace-pre-line text-3xl leading-relaxed tracking-wide">${q.text}</p>
                    <div class="mb-2 flex-grow">${optionsHtml}</div>
                    ${ansHtml}
                `;
                grid.appendChild(card);
            });
        }

        // --- LOGIC: Reading Texts ---
        function initReadingTabs() {
            const tabsContainer = document.getElementById('text-tabs');
            tabsContainer.innerHTML = '';
            testData.texts.forEach((text, index) => {
                const btn = document.createElement('button');
                btn.textContent = text.title;
                btn.className = `shrink-0 px-8 h-14 flex items-center justify-center text-2xl leading-none font-black rounded-t-xl transition-colors ${index === 0 ? 'bg-stone-900 text-cyan-300' : 'bg-stone-200 text-stone-500 hover:bg-stone-300 hover:text-stone-700'}`;
                btn.onclick = () => selectReadingText(text.id, btn);
                tabsContainer.appendChild(btn);
            });
        }

        function selectReadingText(textId, clickedBtn) {
            currentTextId = textId;
            const tabs = document.getElementById('text-tabs').querySelectorAll('button');
            tabs.forEach(btn => {
    if (btn === clickedBtn) {
        // 選中狀態：黑底 (bg-stone-900)、淺藍字 (text-cyan-300)
        btn.className = 'shrink-0 px-8 h-14 flex items-center justify-center text-2xl leading-none font-black rounded-t-xl transition-colors bg-stone-900 text-cyan-300';
    } else {
        // 未選中狀態：灰底、深灰字
        btn.className = 'shrink-0 px-8 h-14 flex items-center justify-center text-2xl leading-none font-black rounded-t-xl transition-colors bg-stone-200 text-stone-500 hover:bg-stone-300 hover:text-stone-700';
    }
});            renderReadingText();
        }

        function renderReadingText() {
            const textData = testData.texts.find(t => t.id === currentTextId);
            if (!textData) return;

            const contentDiv = document.getElementById('text-content');
            contentDiv.innerHTML = `
                <span class="font-bold text-accent bg-orange-100 border-2 border-orange-200 px-4 py-1.5 rounded-xl inline-block mb-6 text-xl tracking-wider">${textData.type}</span>
                <div class="text-stone-800 leading-loose text-[26px] tracking-wide">${textData.content}</div>
            `;

            const qsDiv = document.getElementById('text-questions');
            qsDiv.innerHTML = '<h4 class="font-bold text-4xl mb-8 flex items-center gap-3 text-stone-700 px-2 pb-4 border-b-2 border-stone-200"><span>📝</span> 相關試題</h4>';
            
            const relatedQs = testData.questions.filter(q => textData.questions.includes(q.id));
            
            relatedQs.forEach(q => {
                const qCard = document.createElement('div');
                qCard.className = 'bg-white p-8 rounded-2xl shadow-sm border-2 border-stone-200 mb-8';
                const answered = testData.answeredState.hasOwnProperty(q.id);

                let optionsHtml = q.options.map((opt, i) => {
                    let btnClass = "w-full text-left flex items-start gap-4 p-5 rounded-2xl border-2 transition-colors mb-4 ";
                    let spanClass = "font-black shrink-0 w-12 h-12 flex items-center justify-center rounded-full text-2xl transition-colors ";
                    
                    if (answered) {
                        if (i === q.answer) {
                            btnClass += "border-teal-500 bg-teal-50 text-teal-900 shadow-sm";
                            spanClass += "bg-teal-500 text-white";
                        } else {
                            btnClass += "border-stone-200 bg-white opacity-40 cursor-default";
                            spanClass += "bg-stone-100";
                        }
                        return `<button disabled class="${btnClass}"><span class="${spanClass}">${i+1}</span><span class="mt-1.5 text-2xl leading-relaxed">${opt}</span></button>`;
                    } else {
                        btnClass += "border-stone-200 bg-white hover:bg-stone-50 cursor-pointer hover:border-stone-300";
                        spanClass += "bg-stone-100 text-stone-600";
                        return `<button id="opt-read-${q.id}-${i}" onclick="selectOption(${q.id}, ${i}, 'read')" class="${btnClass}"><span class="${spanClass}">${i+1}</span><span class="mt-1.5 text-2xl leading-relaxed">${opt}</span></button>`;
                    }
                }).join('');

                let ansHtml = '';
                if (answered) {
                    const isCorrect = testData.answeredState[q.id];
                    const headerHtml = isCorrect
                        ? `<div class="font-bold text-teal-700 mb-4 flex items-center gap-3"><span class="text-4xl">✅</span> <span class="text-3xl">答對了！</span></div>`
                        : `<div class="font-bold text-red-700 mb-4 flex items-center gap-3"><span class="text-4xl">❌</span> <span class="text-3xl">正確答案是 ${q.answer + 1}</span></div>`;
                    ansHtml = `<div class="mt-6 p-6 bg-stone-50 rounded-2xl border-2 border-stone-200 block shadow-inner">${headerHtml}<div class="text-stone-800 leading-relaxed text-2xl mt-4 pt-4 border-t-2 border-stone-200"><strong class="text-primary text-3xl mr-2">【詳解】</strong><br>${q.explanation}</div></div>`;
                } else {
                    ansHtml = `<div id="ans-read-${q.id}" class="hidden mt-6 p-6 bg-stone-50 rounded-2xl border-2 border-stone-200 shadow-inner"></div>`;
                }

                qCard.innerHTML = `
                    <div class="flex justify-between items-center mb-6 border-b border-stone-100 pb-4">
                        <span class="font-black text-primary text-3xl">第 ${q.id} 題</span>
                        <span class="text-stone-500 bg-stone-100 px-4 py-2 rounded-xl font-bold text-xl">${q.concept}</span>
                    </div>
                    <p class="font-bold text-textMain mb-8 text-3xl leading-relaxed whitespace-pre-line tracking-wide">${q.text}</p>
                    <div class="mb-2">${optionsHtml}</div>
                    ${ansHtml}
                `;
                qsDiv.appendChild(qCard);
            });
        }

        // --- Core Interaction Function ---
        function selectOption(qId, selectedIdx, context) {
            const q = testData.questions.find(x => x.id === qId);
            if (!q) return;

            const isCorrect = (selectedIdx === q.answer);

            // 紀錄答題狀況，更新計分板
            if (!testData.answeredState.hasOwnProperty(qId)) {
                testData.answeredState[qId] = isCorrect;
                updateScoreBoard();
            }

            // 更新按鈕樣式狀態
            for (let i = 0; i < q.options.length; i++) {
                const btn = document.getElementById(`opt-${context}-${qId}-${i}`);
                if (!btn) continue;
                
                btn.disabled = true;
                btn.classList.remove('hover:bg-stone-50', 'cursor-pointer', 'hover:border-stone-300');
                btn.classList.add('cursor-default');

                const numSpan = btn.querySelector('span');

                if (i === q.answer) {
                    btn.classList.remove('border-stone-200', 'bg-white');
                    btn.classList.add('border-teal-500', 'bg-teal-50', 'text-teal-900', 'shadow-sm');
                    numSpan.classList.remove('bg-stone-100', 'text-stone-600');
                    numSpan.classList.add('bg-teal-500', 'text-white');
                } else if (i === selectedIdx && !isCorrect) {
                    btn.classList.remove('border-stone-200', 'bg-white');
                    btn.classList.add('border-red-500', 'bg-red-50', 'text-red-900', 'shadow-sm');
                    numSpan.classList.remove('bg-stone-100', 'text-stone-600');
                    numSpan.classList.add('bg-red-500', 'text-white');
                } else {
                    btn.classList.add('opacity-40');
                }
            }

            // 顯示解析動畫
            const ansDiv = document.getElementById(`ans-${context}-${qId}`);
            if (ansDiv) {
                const headerHtml = isCorrect
                    ? `<div class="font-bold text-teal-700 mb-4 flex items-center gap-3"><span class="text-4xl">✅</span> <span class="text-3xl">答對了！太棒了！</span></div>`
                    : `<div class="font-bold text-red-700 mb-4 flex items-center gap-3"><span class="text-4xl">❌</span> <span class="text-3xl">答錯了，正確答案是 ${q.answer + 1}</span></div>`;

                ansDiv.innerHTML = `
                    ${headerHtml}
                    <div class="text-stone-800 leading-relaxed text-2xl mt-4 pt-4 border-t-2 border-stone-200">
                        <strong class="text-primary text-3xl mr-2">【詳解】</strong><br>${q.explanation}
                    </div>
                `;
                ansDiv.classList.remove('hidden');
                ansDiv.classList.add('block', 'animate-fade-in');
            }
        }
    </script>
