<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>奇偶數魔法盒 - 提示可隱藏大屏版</title>
    <style>
        /* 哆啦A夢馬卡龍風格大屏配色 */
        :root {
            --dora-blue: #4FC3F7;
            --dora-light-blue: #E1F5FE;
            --dora-white: #FFFFFF;
            --dora-yellow: #FFF176;
            --dora-red: #FF8A80;
            --dora-dark: #263238;
            --dorayaki: #FFB74D;
        }

        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: var(--dora-light-blue);
            font-family: 'Helvetica Neue', Arial, 'Microsoft JhengHei', sans-serif;
            color: var(--dora-dark);
            display: flex;
        }

        /* 左側控制面板 */
        .control-panel {
            width: 35%;
            height: 100%;
            background-color: var(--dora-white);
            box-shadow: 10px 0 30px rgba(0,0,0,0.05);
            padding: 50px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: flex-start; /* 改為靠上對齊，方便提示區向下延伸 */
            gap: 25px;
            z-index: 10;
        }

        .title {
            font-size: 64px;
            color: var(--dora-blue);
            font-weight: bold;
            margin: 0 0 10px 0;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.1);
        }

        /* 觸控友善的數字輸入區 */
        .input-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #F5F5F5;
            border-radius: 40px;
            padding: 15px;
        }

        .btn-adjust {
            width: 90px;
            height: 90px;
            font-size: 60px;
            font-weight: bold;
            border: none;
            border-radius: 50%;
            background-color: var(--dora-white);
            color: var(--dora-blue);
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: all 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .btn-adjust:active { transform: scale(0.9); }

        .number-display {
            font-size: 80px;
            font-weight: bold;
            width: 120px;
            text-align: center;
            color: var(--dora-dark);
        }

        .btn-action {
            width: 100%;
            padding: 25px;
            font-size: 48px;
            font-weight: bold;
            background-color: var(--dora-yellow);
            color: #424242;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(255, 241, 118, 0.4);
            transition: transform 0.2s;
        }

        .btn-action:active {
            transform: scale(0.98) translateY(5px);
        }

        /* 新增：提示控制按鈕 */
        .btn-toggle-hint {
            width: 100%;
            padding: 15px;
            font-size: 32px;
            font-weight: bold;
            background-color: #ECEFF1;
            color: #546E7A;
            border: 2px solid #CFD8DC;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-toggle-hint:active { transform: scale(0.98); }

        /* 【修改重點】放大版的提示區，填滿原本紅框的位置 */
        .hint-box {
            background-color: #ECEFF1;
            padding: 40px 30px;
            border-radius: 30px;
            border: 4px dashed #CFD8DC;
            flex-grow: 1; /* 自動伸展填滿剩餘空間 */
            display: flex;
            flex-direction: column;
            justify-content: center; /* 垂直居中 */
            gap: 30px;
        }

        .hint-title {
            font-size: 48px;
            font-weight: bold;
            color: var(--dora-dark);
            text-align: center;
            margin-bottom: 10px;
        }

        .hint-row {
            font-size: 40px;
            line-height: 1.6;
            text-align: center;
        }

        /* 讓數字背景有像卡片一樣的包覆感 */
        .digit-badge {
            background-color: var(--dora-white);
            padding: 5px 20px;
            border-radius: 20px;
            font-weight: bold;
            letter-spacing: 2px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        /* 右側視覺面板 */
        .visual-panel {
            width: 65%;
            height: 100%;
            padding: 50px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            gap: 20px;
            overflow-y: auto;
        }

        /* 上部：圓點視覺區 */
        .dots-area {
            width: 100%;
            display: flex;
            flex-wrap: wrap;
            align-content: flex-start;
            justify-content: center;
            gap: 30px;
            padding-bottom: 20px;
            border-bottom: 6px solid var(--dora-white);
        }

        .pair-group {
            display: flex;
            gap: 20px;
            background-color: rgba(255, 255, 255, 0.6);
            padding: 20px;
            border-radius: 60px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.04);
            border: 4px solid var(--dora-white);
        }

        .item {
            width: 80px;
            height: 80px;
            background-color: var(--dorayaki);
            border-radius: 50%;
            box-shadow: inset -5px -5px 15px rgba(0,0,0,0.15), 0 5px 10px rgba(0,0,0,0.1);
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            opacity: 0;
            transform: scale(0);
        }

        .item.single { background-color: var(--dora-red); }

        @keyframes popIn {
            to { opacity: 1; transform: scale(1); }
        }

        /* 下部：超大算式與結論區 */
        .info-panel {
            width: 100%;
            background-color: var(--dora-white);
            border-radius: 30px;
            padding: 40px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            border: 6px solid var(--dora-light-blue);
            min-height: 300px;
            color: var(--dora-dark);
            margin-top: 10px;
            position: relative;
        }

        .math-text {
            font-size: 130px; 
            font-weight: bold;
            line-height: 1;
            margin-bottom: 20px;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.1);
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .math-part { visibility: hidden; }

        .conclusion-text {
            font-size: 70px;
            font-weight: bold;
            line-height: 1.2;
            visibility: hidden;
            min-height: 84px;
        }

        .even-text { color: #2E7D32; }
        .odd-text { color: #C62828; }

        /* 算式逐步控制按鈕區 */
        .step-controls {
            display: none;
            margin-top: 30px;
            gap: 20px;
        }

        .btn-step {
            padding: 15px 30px;
            font-size: 28px;
            font-weight: bold;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-next-step {
            background-color: var(--dora-blue);
            color: white;
            box-shadow: 0 5px 15px rgba(79, 195, 247, 0.4);
        }

        .btn-show-all {
            background-color: #E0E0E0;
            color: var(--dora-dark);
        }

        .btn-step:active { transform: scale(0.95); }
        .btn-step:disabled { opacity: 0.5; cursor: not-allowed; }

    </style>
</head>
<body>

    <div class="control-panel">
        <div>
            <h1 class="title">✨ 奇偶數魔法盒</h1>
            
            <div class="input-controls">
                <button class="btn-adjust" onclick="adjustNumber(-1)">-</button>
                <div class="number-display" id="numValue">24</div> <button class="btn-adjust" onclick="adjustNumber(1)">+</button>
            </div>

            <div style="margin-top: 25px;">
                <button class="btn-action" onclick="checkNumber()">配對看看</button>
            </div>

            <div style="margin-top: 20px;">
                <button class="btn-toggle-hint" id="btnToggleHint" onclick="toggleHint()">👁️ 隱藏提示功能</button>
            </div>
        </div>

        <div class="hint-box" id="hintBox">
            <div class="hint-title">🌟 觀察個位數判斷</div>
            <div class="hint-row">
                個位數是 <span class="digit-badge" style="color:#2E7D32;">0, 2, 4, 6, 8</span><br>
                那就是 <strong class="even-text" style="font-size: 46px;">偶數</strong>
            </div>
            <div class="hint-row">
                個位數是 <span class="digit-badge" style="color:#C62828;">1, 3, 5, 7, 9</span><br>
                那就是 <strong class="odd-text" style="font-size: 46px;">奇數</strong>
            </div>
        </div>
    </div>

    <div class="visual-panel">
        <div class="dots-area" id="visualArea"></div>

        <div class="info-panel" id="infoPanel">
            <div id="mathArea" class="math-text"></div>
            <div id="conclusionArea" class="conclusion-text"></div>
            
            <div class="step-controls" id="stepControls">
                <button class="btn-step btn-next-step" id="btnNext" onclick="showNextStep()">▶ 下一步 (被除數)</button>
                <button class="btn-step btn-show-all" onclick="showAllSteps()">⏭ 全部顯示</button>
            </div>
        </div>
    </div>

    <script>
        let currentNumber = 24; 
        const maxNumber = 40; 
        const minNumber = 1;

        let currentStep = 0;
        let totalSteps = 0;
        let isCurrentOdd = false;

        // 【修改重點】顯示與隱藏切換邏輯
        function toggleHint() {
            const hintBox = document.getElementById('hintBox');
            const btn = document.getElementById('btnToggleHint');
            
            if (hintBox.style.display === 'none') {
                hintBox.style.display = 'flex'; // 恢復彈性排版
                btn.innerHTML = '👁️ 隱藏提示功能';
                btn.style.backgroundColor = '#ECEFF1';
                btn.style.color = '#546E7A';
            } else {
                hintBox.style.display = 'none'; // 完全隱藏，釋放空間
                btn.innerHTML = '👁️ 顯示提示功能';
                btn.style.backgroundColor = 'var(--dora-blue)';
                btn.style.color = 'white';
            }
        }

        function adjustNumber(change) {
            let newNumber = currentNumber + change;
            if (newNumber >= minNumber && newNumber <= maxNumber) {
                currentNumber = newNumber;
                document.getElementById('numValue').innerText = currentNumber;
                resetVisuals();
            }
        }

        function resetVisuals() {
            document.getElementById('visualArea').innerHTML = '';
            document.getElementById('mathArea').innerHTML = '';
            document.getElementById('conclusionArea').innerHTML = '';
            document.getElementById('conclusionArea').style.visibility = 'hidden';
            document.getElementById('stepControls').style.display = 'none';
        }

        function checkNumber() {
            resetVisuals();
            
            const visualArea = document.getElementById('visualArea');
            isCurrentOdd = (currentNumber % 2 !== 0);
            const pairs = Math.floor(currentNumber / 2);
            const remainder = currentNumber % 2;

            let delay = 0; 

            for (let i = 0; i < pairs; i++) {
                const groupDiv = document.createElement('div');
                groupDiv.className = 'pair-group';
                for(let j = 0; j < 2; j++) {
                    const item = document.createElement('div');
                    item.className = 'item';
                    item.style.animationDelay = `${delay}s`;
                    groupDiv.appendChild(item);
                    delay += 0.06; 
                }
                visualArea.appendChild(groupDiv);
            }

            if (remainder === 1) {
                const groupDiv = document.createElement('div');
                groupDiv.className = 'pair-group';
                const item = document.createElement('div');
                item.className = 'item single';
                item.style.animationDelay = `${delay}s`;
                groupDiv.appendChild(item);
                visualArea.appendChild(groupDiv);
            }

            setTimeout(() => {
                prepareMathSteps(pairs);
            }, delay * 1000 + 400);
        }

        function prepareMathSteps(pairs) {
            const mathArea = document.getElementById('mathArea');
            
            let html = `
                <span class="math-part" id="step1">${currentNumber}</span>
                <span class="math-part" id="step2">÷</span>
                <span class="math-part" id="step3">2</span>
                <span class="math-part" id="step4">=</span>
                <span class="math-part" id="step5">${pairs}</span>
            `;
            totalSteps = 5;

            if (isCurrentOdd) {
                html += `<span class="math-part" id="step6">... 1</span>`;
                totalSteps = 6;
            }

            mathArea.innerHTML = html;

            const conclusionArea = document.getElementById('conclusionArea');
            if (isCurrentOdd) {
                conclusionArea.innerHTML = `<span class="odd-text">÷2 剩1，是奇數！</span>`;
            } else {
                conclusionArea.innerHTML = `<span class="even-text">÷2 整除，沒有餘數，是偶數！ </span>`;
            }

            document.getElementById('stepControls').style.display = 'flex';
            currentStep = 0;
            updateStepButtonText();
        }

        function showNextStep() {
            if (currentStep < totalSteps) {
                currentStep++;
                document.getElementById(`step${currentStep}`).style.visibility = 'visible';
                updateStepButtonText();
            } else if (currentStep === totalSteps) {
                document.getElementById('conclusionArea').style.visibility = 'visible';
                currentStep++;
                updateStepButtonText();
            }
        }

        function showAllSteps() {
            for (let i = 1; i <= totalSteps; i++) {
                document.getElementById(`step${i}`).style.visibility = 'visible';
            }
            document.getElementById('conclusionArea').style.visibility = 'visible';
            currentStep = totalSteps + 1;
            updateStepButtonText();
        }

        function updateStepButtonText() {
            const btn = document.getElementById('btnNext');
            btn.disabled = false;
            
            switch (currentStep) {
                case 0: btn.innerText = "▶ 下一步 (被除數)"; break;
                case 1: btn.innerText = "▶ 下一步 (除號)"; break;
                case 2: btn.innerText = "▶ 下一步 (除以2)"; break;
                case 3: btn.innerText = "▶ 下一步 (等號)"; break;
                case 4: btn.innerText = "▶ 下一步 (商)"; break;
                case 5: 
                    if (isCurrentOdd) btn.innerText = "▶ 下一步 (餘數)"; 
                    else btn.innerText = "▶ 下一步 (結論)";
                    break;
                case 6: 
                    if (isCurrentOdd) btn.innerText = "▶ 下一步 (結論)";
                    else { btn.innerText = "✅ 完成"; btn.disabled = true; }
                    break;
                default: 
                    btn.innerText = "✅ 完成"; 
                    btn.disabled = true;
            }
        }

        window.onload = checkNumber;
    </script>
</body>
</html>
